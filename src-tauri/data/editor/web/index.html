<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影编辑器</title>
<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
<style>
  :root{
    --bg:#0f1115; --card:#161a21; --inset:#1d222b; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#98a1b3; --brand:#5ac8fa; --ok:#5ad18a; --warn:#ffcc66; --err:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px 18px;
  }
  .wrap{width:100%;max-width:760px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  header img{height:34px;image-rendering:pixelated}
  .tag{
    margin-left:auto;font-size:12px;color:var(--muted);
    border:2px solid var(--line);padding:3px 8px;letter-spacing:.04em;
  }
  .card{background:var(--card);border:2px solid var(--line);padding:22px}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.7}
  .drop{
    border:2px dashed var(--line);background:var(--inset);padding:34px 20px;text-align:center;
    cursor:pointer;transition:border-color .15s,background .15s;display:block;
  }
  .drop:hover,.drop.hot{border-color:var(--brand);background:#1b2530}
  .drop b{display:block;font-size:15px;margin-bottom:8px}
  .drop span{color:var(--muted);font-size:12.5px}
  .drop .big{font-size:34px;line-height:1;margin-bottom:12px;color:var(--brand)}
  input[type=file]{display:none}
  .row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  a.btn,button.btn{
    font-family:inherit;font-size:13px;font-weight:700;color:var(--text);text-decoration:none;
    background:var(--inset);border:2px solid var(--line);padding:9px 14px;cursor:pointer;
  }
  a.btn:hover,button.btn:hover{border-color:var(--brand);color:var(--brand)}
  .status{margin-top:16px;font-size:13px;line-height:1.7;min-height:20px}
  .status.err{color:var(--err)}
  .status.ok{color:var(--ok)}
  .status.info{color:var(--muted)}
  ul{margin:14px 0 0;padding-left:20px;color:var(--muted);font-size:12.5px;line-height:1.9}
  code{color:var(--brand);background:#0c0f14;padding:1px 5px;border:1px solid var(--line)}
  .progress{height:6px;background:var(--inset);border:1px solid var(--line);margin-top:12px;display:none}
  .progress i{display:block;height:100%;width:0;background:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="brand">投影编辑器</span>
    <span class="tag">本地运行</span>
  </header>

  <div class="card">
    <h1>打开投影文件，进入离线编辑器</h1>
    <p class="sub">
      选择本机的 <code>.litematic</code> 或 <code>.schem</code> 文件，文件只在本机处理，不会上传到任何服务器。
      解析、编辑、导出全部在浏览器里完成，断网也能用。
    </p>

    <label class="drop" id="drop">
      <span class="big">⛏</span>
      <b>点击选择投影文件，或直接拖进来</b>
      <span>支持 .litematic / .schem，单文件最大 50MB</span>
      <input type="file" id="file" accept=".litematic,.schem">
    </label>
    <div class="progress" id="progress"><i></i></div>
    <div class="status info" id="status">等待选择文件……</div>

    <div class="row">
      <a class="btn" href="/studio/editor">直接进入编辑器</a>
      <button class="btn" type="button" id="open-library">从本地蓝图库打开</button>
    </div>

    <div id="library-panel" hidden>
      <div class="status info" id="library-status">正在读取本地蓝图库……</div>
      <ul id="library-list"></ul>
    </div>

    <ul>
      <li>本程序不含账号功能：云端作品、建筑库、登录相关按钮不可用。</li>
      <li>编辑进度保存在浏览器本地，导出的投影文件可正常在游戏里使用。</li>
      <li>本地服务跟随 McSTools 进程，退出应用即随之停止。</li>
    </ul>
  </div>
</div>

<script>
(function () {
  var fileInput = document.getElementById('file');
  var drop = document.getElementById('drop');
  var status = document.getElementById('status');
  var progress = document.getElementById('progress');
  var bar = progress.firstElementChild;
  var MAX = 50 * 1024 * 1024;

  function say(text, kind) {
    status.className = 'status ' + (kind || 'info');
    status.textContent = text;
  }

  function extOf(name) {
    var i = name.lastIndexOf('.');
    return i < 0 ? '' : name.slice(i).toLowerCase();
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) { handle(fileInput.files[0]); }
  });
  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('hot'); });
  });
  drop.addEventListener('drop', function (e) {
    var dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) { handle(dt.files[0]); }
  });

  function handle(file) {
    var ext = extOf(file.name);
    if (ext !== '.litematic' && ext !== '.schem') {
      say('不支持的文件格式：' + (ext || '未知') + '，请选择 .litematic 或 .schem 文件。', 'err');
      return;
    }
    if (file.size > MAX) {
      say('文件过大（' + (file.size / 1048576).toFixed(1) + 'MB），本地打开上限 50MB。', 'err');
      return;
    }
    say('正在准备 ' + file.name + ' ……', 'info');
    progress.style.display = 'block';
    bar.style.width = '25%';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/local/upload?name=' + encodeURIComponent(file.name), true);
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    xhr.upload.onprogress = function (e) {
      if (e.lengthComputable) { bar.style.width = (25 + 60 * e.loaded / e.total) + '%'; }
    };
    xhr.onerror = function () { say('本地服务无响应，请确认启动窗口仍在运行。', 'err'); };
    xhr.onload = function () {
      var res;
      try { res = JSON.parse(xhr.responseText); } catch (e) { res = null; }
      if (!res || !res.success) {
        say('准备失败：' + ((res && res.error) || ('HTTP ' + xhr.status)), 'err');
        return;
      }
      bar.style.width = '100%';
      say('正在进入编辑器……', 'ok');
      sessionStorage.clear();
      sessionStorage.setItem('studio_source_type', 'projection_url');
      sessionStorage.setItem('studio_projection_url', res.url);
      sessionStorage.setItem('studio_building_name', file.name.replace(/\.(litematic|schem)$/i, ''));
      window.location.href = '/studio/editor';
    };
    xhr.send(file);
  }
})();
</script>
<script>
(function () {
  var button = document.getElementById('open-library');
  var panel = document.getElementById('library-panel');
  var status = document.getElementById('library-status');
  var list = document.getElementById('library-list');
  if (!button || !panel || !status || !list) { return; }

  button.addEventListener('click', function () {
    panel.hidden = !panel.hidden;
    if (panel.hidden) { return; }
    status.textContent = '正在读取本地蓝图库……';
    list.textContent = '';
    fetch('/local/schematics')
      .then(function (response) { return response.json(); })
      .then(function (payload) {
        var items = (payload && payload.data) || [];
        if (!payload || payload.success !== true) {
          status.textContent = '本地蓝图库不可用';
          return;
        }
        if (items.length === 0) {
          status.textContent = '本地蓝图库里还没有投影，先在上面选一个文件导入。';
          return;
        }
        status.textContent = '共 ' + items.length + ' 份，点一份打开：';
        items.forEach(function (item) {
          var li = document.createElement('li');
          var link = document.createElement('a');
          link.className = 'btn';
          link.href = '/local/open-schematic?id=' + encodeURIComponent(item.id);
          link.textContent = item.name + ' · ' + item.extension + ' · ' + item.size + ' · ' + item.updatedAt;
          li.appendChild(link);
          list.appendChild(li);
        });
      })
      .catch(function (error) {
        status.textContent = '读取本地蓝图库失败：' + error;
      });
  });
})();
</script>
</body>
</html>
